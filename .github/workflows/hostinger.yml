# À chaque modification du code (app/), compile le site et met à jour
# la version prête à servir à la racine du dépôt (GitHub Pages)
# ainsi que la branche "hostinger".
name: Compiler le site

on:
  push:
    branches: [main]
    paths: ['app/**', 'package.json', 'package-lock.json', 'vite.config.js', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run publish
      - name: Enregistrer la version compilée sur main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A index.html mentions-legales.html confidentialite.html assets 404.html contact.php .htaccess robots.txt sitemap.xml .nojekyll
          git diff --cached --quiet || (git commit -qm "Site compilé [skip ci]" && git push)
      - name: Publier aussi sur la branche hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
